[package]
name = "rust-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
clap = {version = "4.5.50", features = ["derive"]}
colored = "3.0.0"
crossterm = "0.28"
rustls = "0.23"
rustls-pemfile = "2.0"
tokio-rustls = "0.26"
tokio = { version = "1", features = ["full"] }
rcgen = "0.13"
